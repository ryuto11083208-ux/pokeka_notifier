name: "TCG Lottery Board"

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "dashboard.py"
      - "dashboard_template.html"
      - "main.py"
      - ".github/workflows/board.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tcg-board
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build board page
        env:
          DASHBOARD_OUT: _site/index.html
        run: python dashboard.py --no-open

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
